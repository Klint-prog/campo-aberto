name: Laravel CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: campo_aberto_testing
          POSTGRES_USER: campo_aberto
          POSTGRES_PASSWORD: campo_aberto
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U campo_aberto -d campo_aberto_testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, mbstring, intl, pdo_pgsql, redis, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create testing env
        run: cp .env.testing.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Seed foundation data
        run: php artisan db:seed --force

      - name: Run test suite
        run: php artisan test

      - name: Run Pint check
        run: ./vendor/bin/pint --test
